<style id="css">:root{

}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:1080px;margin:0 auto;padding:36px 22px 64px}

.btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.bar select{background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:5px 8px;font-weight:500;max-width:15em}
.bar .status{color:var(--muted);font-size:.9rem;margin-left:auto}
.notice{border-left:3px solid var(--ink);padding:6px 12px;margin:0 0 12px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.follow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px}
.follow input{background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:5px 9px;width:14em}
.chip{font:500 .9rem var(--sans);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:4px 12px 4px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip .sw{width:20px;height:0;border-top:3px dashed var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.found{color:var(--muted);font-size:.92rem}
.found button{font:500 .86rem var(--sans);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;cursor:pointer;color:var(--ink)}
.board{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.lanes{flex:0 0 96px;position:relative}
.lanes span{position:absolute;left:0;right:6px;transform:translateY(-50%);font:700 .9rem var(--sans);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;outline:none}
.scroll:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
svg.tl{display:block}
.dayn{font:500 12px var(--sans);fill:var(--muted)} .dayn.sel{fill:var(--ink);font-weight:700}
.node,.cell{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0 30px;font-size:.88rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.detail{max-width:74ch}
.dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font-family:var(--serif);font-weight:600;font-size:2rem;margin:0}
.dhead .status{color:var(--muted);font-size:.96rem}
.steps{margin-left:auto;display:flex;gap:6px}
.event{border-left:3px solid var(--pc);padding:2px 0 2px 16px;margin:20px 0}
.event .who{font:700 .9rem var(--sans);color:var(--pc)}
.event h3{font-family:var(--serif);font-weight:600;font-size:1.4rem;line-height:1.2;margin:2px 0}
.event .where{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0 0 8px}
.event p.sum{font-family:var(--serif);font-size:1.07rem;line-height:1.6;margin:0 0 8px}
.beats{list-style:none;counter-reset:b;margin:10px 0;padding:0}

.beats li::before{content:counter(b);position:absolute;left:0;top:.05em;width:1.5em;text-align:right;font:500 .82rem var(--sans);color:var(--pc)}
.q{margin:12px 0 4px}.q blockquote{font-family:var(--serif);font-style:italic;font-size:1.05rem;margin:0}
.q blockquote::before{content:"“"}.q blockquote::after{content:"”"}
.q figcaption{font:500 .87rem var(--sans);color:var(--muted);margin-top:2px}
.note{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.secret{font-size:.92rem;border:1px dashed var(--rule);border-radius:6px;padding:6px 10px;margin:10px 0 0}
.secret b{font-weight:700}
.daynote{font-family:var(--serif);font-size:1.05rem;border-left:3px solid var(--rule);padding:2px 0 2px 16px;margin:14px 0}
.cross h4{font-family:var(--serif);font-weight:600;font-size:1.18rem;margin:26px 0 8px}
.cross ul{margin:0;padding-left:1.1em}.cross li{margin:0 0 6px;font-family:var(--serif);font-size:1.04rem}
mark{background:color-mix(in srgb,var(--ink) 15%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{font-family:var(--serif);color:var(--muted);font-size:1.05rem}
.form{display:grid;gap:12px;margin:14px 0}
.form label{display:grid;gap:4px;font:500 .9rem var(--sans)}
.form .row{display:flex;flex-wrap:wrap;gap:12px}.form .row>label{flex:1 1 9em}
.form .hint{font-weight:400;color:var(--muted);font-size:.84rem}
input[type=text],input[type=number],select,textarea{background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:6px 9px}
textarea{min-height:5.2em;resize:vertical;line-height:1.45;font-family:var(--serif);font-size:1rem}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--rule);border-radius:7px;background:var(--field)}
.settings{border:1px solid var(--rule);border-radius:10px;padding:4px 16px 12px;margin:0 0 18px}
.settings summary{cursor:pointer;font:700 .98rem var(--sans);padding:8px 0}
.settings h3{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:16px 0 6px}
.tbl{display:grid;gap:8px}
.tbl .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbl .r input[type=text]{flex:1 1 10em}.tbl .r input.cast{flex:2 1 16em}
.tbl .r input[type=number]{width:5.2em}
.evlist{margin:6px 0 14px;padding:0;list-style:none}
.evlist li{margin:4px 0}
.evlist .btn{text-align:left}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--ground);color:var(--ink);max-width:min(560px,92vw);padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 10px}
dialog .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
dialog textarea{width:100%;min-height:9em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
.lib{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lib li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--rule);padding:6px 0}
.lib li .t{flex:1 1 12em;font-family:var(--serif);font-size:1.08rem}
.lib li .t small{display:block;font-family:var(--sans);color:var(--muted);font-size:.82rem}
.foot{margin-top:44px;font-size:.88rem;color:var(--muted);max-width:74ch}
.err{color:#B23B3B;font-size:.9rem}
@media (max-width:600px){.wrap{padding:26px 14px 48px}.lanes{flex-basis:74px}.steps{margin-left:0}.bar .status{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.char{border-top:1px solid var(--rule);padding:8px 0}
.char .stints{display:grid;gap:6px;margin:6px 0 0 14px}
.roster{margin:0;padding-left:1.1em}.roster li{margin:0 0 6px;font-family:var(--serif);font-size:1.04rem}
dialog{max-height:88vh;overflow:auto}
dialog h3{font-family:var(--serif);font-weight:600;font-size:1.12rem;margin:16px 0 4px}
.help p{margin:0 0 6px;font-family:var(--serif);font-size:1.02rem;line-height:1.5}
.mtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 6px}
.merge{max-height:52vh;overflow-y:auto;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0 2px 6px}
.mlist{list-style:none;margin:0;padding:0}
.mi{border-bottom:1px solid var(--rule);padding:7px 0}.mi:last-child{border-bottom:0}
.mi label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mi input{margin-top:.35em;flex:none}
.mi b{font-weight:500}
.mi small{display:block;color:var(--muted);font-size:.85rem}
.mi.off{opacity:.6}
.mi details{margin:4px 0 0 26px;font-size:.9rem}
.mi summary{cursor:pointer;color:var(--muted)}

.loc{font:500 9.5px var(--sans);fill:var(--muted)}
.event .loct{font:500 .86rem var(--sans);color:var(--pc);margin:-4px 0 8px}
.ck{display:inline-flex;align-items:center;gap:5px;font:400 .88rem var(--sans);white-space:nowrap}
.tbl .r.flux{margin:-2px 0 6px 0;padding-left:12px;border-left:2px solid var(--rule)}
.tbl .r.flux label{display:inline-flex;align-items:center;gap:6px;font:400 .9rem var(--sans)}
.rost{margin:10px 0 14px}
.rost h5{font:700 .92rem var(--sans);margin:0 0 6px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchips.dep{margin-top:6px}
.pchips .lbl{font:500 .86rem var(--sans);color:var(--muted);margin-right:2px}
.pchip{font:500 .92rem var(--sans);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:baseline;gap:6px}
.pchip:hover{border-color:var(--muted)}

.addp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;font-size:.92rem;color:var(--muted)}
.addp input[type=text]{flex:1 1 10em;color:var(--ink)}
.roster .dep{font-size:.95rem;color:var(--muted);margin-top:2px}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.prow label{flex:1 1 16em}
.laneblk{margin:14px 0 0;padding:6px 0 6px 12px;border-left:3px solid transparent;border-radius:2px}
.laneblk.pick{border-left-color:var(--pc);background:var(--band)}
.colhit{cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--rule);margin:2px 0 12px}
.tab{font:500 .92rem var(--sans);background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 10px;margin-bottom:-1px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}
.tabp>.note:first-child{margin-top:0}
.sm{display:inline-flex;align-items:center;gap:6px;font:400 .9rem var(--sans);white-space:nowrap}
.lrow{padding:6px 0;border-bottom:1px solid var(--rule)}
.lrow .lbtns{display:inline-flex;gap:2px;margin-left:auto}
.sp{border:1px solid var(--rule);border-left:4px solid var(--pc);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.sp .fprev{margin:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{font:500 .88rem var(--sans);background:transparent;border:0;border-left:1px solid var(--rule);padding:4px 11px;cursor:pointer;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.lops{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.lops .btn{font-size:.84rem;color:var(--muted)}
#tl .dayn,#tl .spanr,#tl .loc,#tl .slowbar,#tl path{pointer-events:none}
.laneblk .btn.hi{outline:2px solid var(--pc);outline-offset:1px}
details.event.fold>summary{list-style:none;cursor:pointer;display:block}
details.event.fold>summary::-webkit-details-marker{display:none}
details.event.fold>summary:focus-visible{outline:2px solid var(--pc);outline-offset:4px;border-radius:2px}
details.event.fold .more{display:inline-flex;align-items:center;gap:8px;font:500 .86rem var(--sans);color:var(--pc);margin:0 0 2px}
details.event.fold .more::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details.event.fold[open] .more::before{transform:rotate(90deg)}
details.event.fold .more .hide,details.event.fold[open] .more .show{display:none}
details.event.fold[open] .more .hide{display:inline}
details.event.fold .more mark{font-weight:400}
details.event.fold .evbody{padding-top:6px}
details.event.fold>summary p.sum{margin-bottom:4px}
.foldbar{display:flex;justify-content:flex-end;margin:6px 0 -8px}
.credit{display:flex;flex-wrap:wrap;gap:4px 14px;font:400 .84rem var(--sans);color:var(--muted);margin:10px 0 0}
.credit a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.credit a:hover{color:var(--ink)}
.wrap>.credit{margin-top:6px}
dialog .credit{margin-top:16px;padding-top:10px;border-top:1px solid var(--rule)}
.welcome{max-width:min(520px,92vw)}
.welcome h2{margin-top:0}
.welcome .wlead{font-family:var(--serif);font-size:1.12rem;line-height:1.45;margin:0 0 8px}
.welcome .wl{margin:8px 0 4px;padding-left:1.2em;line-height:1.5}
.welcome .wl li{margin:4px 0}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.btn.go{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.go:hover{opacity:.9}
</style>

<script id="appjs">/* ============================================================================
 THREADS: developer notes (kept inside the code so they travel with the page)
 A timeline notebook for tabletop campaigns: lanes (parties, characters, world
 events) across numbered steps (Day/Session/Week), with events, spans,
 connections, day notes, characters with stints, follow, import/export, publish.

 STRUCTURE. One self-contained HTML file with exactly three moving parts:
   <style id="css">                        styles
   <script type="application/json" id="seed">  timelines baked in at publish
   <script id="appjs">                      this code (renders the whole UI)
 The page REPUBLISHES ITSELF (buildDoc) from HEAD + those three parts, so:
 keep all markup generated by JS, add nothing outside them, and never write a
 literal closing script tag inside this code (use "<\/script>").

 CAPABILITIES: artifact (owner's "Publish to this page"), downloads (Export),
 user (canEdit() hides Publish from non-editors). Deliberately NOT db: it makes
 the page organization-internal, and players outside the org must open it.

 STORAGE. localStorage "threads-workspace-v1" holds the workspace
 {format:"threads-workspace",version:1,current,timelines:[...]}. sessionStorage
 "threads-view" remembers the last day viewed; "threads-open" (localStorage)
 whether the day summary shows every event's details or just its headline. All storage is try/catch guarded.

 PUBLISH / UPDATE FLOW. Seed timelines carry publishedAt; local copies carry
 basedOn. If a seed's publishedAt is newer than the local basedOn, a notice
 offers: load (replace), load as a separate copy, or keep mine. Private notes
 (event.secret) are always stripped on publish, and on export unless checked.
 >> When changing CODE ONLY, leave the seed script exactly as it is (same
 >> publishedAt), or every visitor gets an "updated version" notice.

 FILE FORMAT "threads-timeline" v1:
   {id,title,subtitle,dayLabel,dayCount,updated,publishedAt?,basedOn?,
    lanes:[{id,name,color,now,roster}],   roster false = no "Who's where" list
    events:[{id,lane,day,sub?,title,where,status,summary,beats[],quotes[{who,text}],notes,secret}],
      status: confirmed | partial | placeholder | upcoming
    crossings:[{id,from:{lane,day},to:{lane,day},text}],
    spans:[{id,lane,from,to,label,color,flux}],
      flux: null | {mode:"fast"|"slow", n, start}  fast: n days there per day
      here (n<=12); slow: one day there per n days here; start: first local day
    dayNotes:{ "<day>": text },
    characters:[{id,name,memberships:[{lane,from,to|null,note}]}],
    origin?}   origin = id of the timeline this one was copied from
 normalize() validates every import and migrates older files (lane.cast lists
 become characters). Workspace files ("threads-workspace") hold several.

 GROUP WORKFLOW (MERGE). Players edit their own copy and Export it; the keeper
 Imports it. importText() sends any timeline that findMine() recognizes (same
 id, or linked by origin) to openReview(), which lists diffTimelines(mine,
 theirs): new and changed lanes' "now", events, connections, spans, day notes
 and characters, each with a checkbox. Merges only add or update, never
 delete; theirs' private notes are ignored; items that need a new lane pull it
 in; one snap() makes the whole merge undoable. "How this works" (openHelp)
 explains the loop to players. Export can also save a blank copy of the app
 (buildDoc with no timelines) as threads.html for other groups.

 RULES & CONVENTIONS. One event per lane per day (details go in beats), except
 inside a fast-flux span, where each day has n spots (event.sub 2..n; absent
 means spot 1). Nothing may leave an event with a sub beyond its day's spots:
 span edits that would are refused (subsBroken), normalize() drops stray subs.
 DAY SUMMARY. In view mode each event is a <details class="fold">: the
 summary line is lane, title, place, local time and summary; beats, quotes,
 notes and private notes open below. Open state is per event for the session
 (openEv), with "Show/Hide all details" (allOpen) as the default; an event
 whose hidden part matches Follow opens itself and says so. Events with
 nothing more to show stay plain articles. The editor preview is never folded.
 DOWNLOADS. On claude.ai, Export saves through the downloads capability (DL).
 Elsewhere (no window.claude), browsers with showSaveFilePicker (Chrome, Edge
 on desktop) get a Save as window (saveAs), so a file can be replaced under
 the same name; cancelling it does nothing. Other browsers, or a picker that
 isn't allowed (e.g. in a frame), use browserSave(), a Blob download link; if
 that fails too, Export shows the text to copy.
 VERSION & CREDIT. THREADS_VERSION follows semantic versioning; bump it and
 add an entry to CHANGELOG.md in the repo (REPO_URL) with every release. The
 footer, help and welcome show it with links to the guide and changelog.
 WELCOME. First-time visitors (no saved workspace, no "threads-welcomed" in
 localStorage) get #welcome, a separate dialog from #dlg, once per browser;
 Help can show it again.
 SELECTING. Clicking a day column (.colhit, either mode) selects the day.
 In edit mode an empty lane cell only selects: pickSpot() sets pend
 {lane,day,sub}, draws a dashed marker, and highlights that lane's block in
 the day panel, whose "Add an event here" creates it. Nothing is created by a
 single click on the timeline. Clicking an event in edit mode selects its day
 and highlights it (hiEv, pickEvent); double-click or its Edit button opens
 the editor. Day numbers, spans, bars and labels don't take clicks.
 SLOW SPANS. In a slow span each day there is one spot covering n days here
 (blockOf). Its event always sits on the block's first day: touch() and
 normalize() snap events there (snapSlow), laneDay() maps any day in a block
 to its start for eventsAt/evAtSub/createEvent and the editor. Span edits
 that would put two events in one block ask first: trySpanChange() lists the
 clashes and, if agreed, combineClashes() folds each group into its first
 event (others become beats, quotes and notes kept). Faster-spot breakage (fastBroken) is still refused. Nodes sit
 mid-block over a bar showing its length.
 LAYOUT. layout() sets per-day column widths (fast spans widen days to n*30px
 on visible lanes); always position with X(d), CL(d), CW(d) and subX(), never
 PADX+(d-1)*COLW. Uniform timelines keep the original coordinates.
 WHO'S WHERE. membersOn() reads character stints. A stint whose "to" is the
 day is a departure (rosterOn splits staying/departing); its note says why,
 else departureOf() names the lane they go to. A stint starting that day is
 an arrival only if they weren't with that lane the day before and the lane
 isn't just starting (arrivalOf: "joins", or "rejoins" if they were with it
 earlier, plus "from X" for a lane left that day or the day before). Moves
 are same-day: moveChar() ends the stint ON the day and starts the new one
 that day, so both lanes list them; moving back to a lane left that same day
 undoes the move. staysAfterAll() cancels a departure and any move it began.
 joinChar() adds someone from a chosen day (for "been there all along"),
 refusing overlaps with another lane. The edit-mode panel
 (rosterEditor/bindRoster) shows people as chips; openPerson() holds the
 actions (edit this stint's dates, move, depart with a reason, stays after
 all, not with them, all stints).
 tidyStints() joins touching or overlapping stints on one lane.
 All user text is escaped through esc()/hl() before it reaches innerHTML.
 Undo is a snapshot stack: call snap() before the first change of an edit.
 Day insert/remove shift events, spans, crossings, dayNotes, stints and lane
 "now" together (shiftFrom / removeDay). Per-lane insert/remove (laneInsert /
 laneRemove, via shiftLane) moves only that lane's events, spans, stints, "now"
 and connection ends; day notes are shared and stay put.
 SETTINGS are tabbed (Timeline, Lanes, Spans, Characters); every tab panel is
 always in the DOM, hidden when inactive; box.dataset.tab remembers the tab.

 DESIGN. Stitched threads: dashed lanes, knots for connections, hatched spans.
 Alegreya + Alegreya Sans. Cool linen ground, woad-blue dark mode, color
 tokens on :root. Sentence case, no all-caps labels, no middle-dot separators.

 TESTING. Headless jsdom suites in threads_dev_kit.zip: test.js, test2.js,
 test3.js (60 checks, written against the kit's own threads.html fixture seed)
 test4.js (25 checks on merging, help and the blank app copy) and test5.js
 (55 checks on who's where editing and time flux) and test6.js (26 checks
 on settings tabs, span cards and per-lane day insert/remove) and test7.js
 (24 checks on joins/rejoins, same-day moves, stays after all, adding people
 and selecting in edit mode), test8.js (13 checks on the folding day
 summary), test9.js (16 checks on the welcome screen, version and links) and
 test10.js (14 checks on downloads and Save as for self-hosted pages); test4
 to test10 work with any seed. 233 in all. Run them after every change before republishing.
============================================================================ */

/* ---------- header / bar ---------- */

function switchTo(id){ if(saveTimer) saveNow(); WS.current=id; T=cur(); undoStack=[]; selEv=null; pend=null; hiEv=null; hidden={}; follow=""; pickStartDay(); saveNow(); renderAll(); scrollToSel(false); }

function renderNotices(){
  var h=notices.map(function(n,i){
    if(n.kind==="added") return '<div class="notice">A published timeline, “'+esc(n.title)+'”, was added to your list. <button class="btn quiet" data-open="'+esc(n.id)+'" data-i="'+i+'">Open it</button><button class="btn quiet" data-dismiss="'+i+'">Dismiss</button></div>';
    return '<div class="notice">A newer version of “'+esc(n.title)+'” has been published here. <button class="btn" data-load="'+i+'">Load it, replacing my copy</button><button class="btn" data-both="'+i+'">Load it as a separate copy</button><button class="btn quiet" data-keep="'+i+'">Keep mine</button></div>';
  }).join("");
  var box=$("#notices"); box.innerHTML=h;
  $$("[data-dismiss]",box).forEach(function(b){b.onclick=function(){notices.splice(+b.dataset.dismiss,1); renderNotices();};});
  $$("[data-open]",box).forEach(function(b){b.onclick=function(){notices.splice(+b.dataset.i,1); switchTo(b.dataset.open);};});
  $$("[data-keep]",box).forEach(function(b){b.onclick=function(){var n=notices[+b.dataset.keep]; var s=seedTls.filter(function(t){return t.id===n.id;})[0]; var m=WS.timelines.filter(function(t){return t.id===n.id;})[0]; if(m&&s) m.basedOn=s.publishedAt; notices.splice(+b.dataset.keep,1); saveNow(); renderNotices();};});
  $$("[data-load]",box).forEach(function(b){b.onclick=function(){var n=notices[+b.dataset.load]; var s=seedTls.filter(function(t){return t.id===n.id;})[0]; if(!s) return;
    var i=WS.timelines.map(function(t){return t.id;}).indexOf(n.id); var c=clone(s); c.basedOn=s.publishedAt;
    var mine=WS.timelines[i]; if(mine){ var sec={}; mine.events.forEach(function(e){if(e.secret) sec[e.id]=e.secret;}); c.events.forEach(function(e){if(sec[e.id]) e.secret=sec[e.id];}); }
    if(n.id===T.id) snap(); WS.timelines[i]=c; if(n.id===T.id) T=c; notices.splice(+b.dataset.load,1); saveNow(); renderAll();};});
  $$("[data-both]",box).forEach(function(b){b.onclick=function(){var n=notices[+b.dataset.both]; var s=seedTls.filter(function(t){return t.id===n.id;})[0]; var m=WS.timelines.filter(function(t){return t.id===n.id;})[0];
    if(!s) return; var c=clone(s); c.origin=s.id; c.id=uid("tl"); c.title=s.title+" (published)"; c.basedOn=""; delete c.publishedAt; WS.timelines.push(c); if(m) m.basedOn=s.publishedAt; notices.splice(+b.dataset.both,1); saveNow(); switchTo(c.id);};});
}

/* ---------- follow / lane chips ---------- */

  var chips=T.lanes.map(function(l){return '<button type="button" class="chip" data-lane="'+esc(l.id)+'" aria-pressed="'+(!hidden[l.id])+'" style="--c:'+esc(l.color)+'"><span class="sw"></span>'+esc(l.name)+'</button>';}).join("");
  $("#followBox").innerHTML=chips+'<label for="fol" style="font:500 .92rem var(--sans)">Follow</label><input id="fol" type="text" list="castList" placeholder="A name or word" value="'+esc(follow)+'" autocomplete="off"><datalist id="castList">'+Object.keys(cast).sort().map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist><span class="found" id="found"></span>';
  $$(".chip",$("#followBox")).forEach(function(b){b.onclick=function(){var id=b.dataset.lane; var shown=visLanes().length; if(!hidden[id]&&shown<=1) return; hidden[id]=!hidden[id]; renderAll();};});
  var inp=$("#fol"), t=null; inp.oninput=function(){clearTimeout(t); t=setTimeout(function(){follow=inp.value.trim(); if(follow){var ds=foundDays(); if(ds.length&&ds.indexOf(sel)<0){sel=ds[0]; selEv=null;}} draw(); renderPanel(); renderFound(); scrollToSel(false);},220);};
  inp.onchange=function(){clearTimeout(t); follow=inp.value.trim(); if(follow){var ds=foundDays(); if(ds.length&&ds.indexOf(sel)<0){sel=ds[0]; selEv=null;}} draw(); renderPanel(); renderFound(); scrollToSel(false);};
  renderFound();
}
function foundDays(){var s={}; mentionDays().forEach(function(d){s[d]=1;}); var c=followChar(); if(c) c.memberships.forEach(function(m){if(hidden[m.lane]) return; for(var d=m.from;d<=memberEnd(m);d++) if(evAt(m.lane,d)) s[d]=1;}); return Object.keys(s).map(Number).sort(function(a,b){return a-b;});}
function renderFound(){var f=$("#found"); if(!f) return; if(!follow){f.innerHTML=""; return;} var ds=mentionDays(), c=followChar(), h="";
  if(c&&c.memberships.length){ h+=esc("With "+c.memberships.slice().sort(function(a,b){return a.from-b.from;}).map(stintText).join(", then ")+". "); }
  h+=ds.length?("Mentioned on "+ds.length+" "+(ds.length>1?dayWordL()+"s":dayWordL())+": "+ds.map(function(d){return '<button type="button" data-d="'+d+'">'+d+'</button>';}).join("")):(c?"":"Not mentioned yet.");
  f.innerHTML=h;
  $$("button",f).forEach(function(b){b.onclick=function(){select(+b.dataset.d,true);};});}

    if(!m) add({key:"c:"+c.id,group:"new",label:"Character: "+c.name,detail:stints(c)?"With "+stints(c):"",needs:needLane(lanes),apply:function(T){var k=clone(c); if(T.characters.some(function(y){return y.id===k.id;})) k.id=uid("c"); T.characters.push(k);}});
    else if(!sameJSON(c.memberships,m.memberships)||c.name!==m.name) add({key:"c:"+m.id,group:"changed",label:"Character: "+c.name,detail:"With "+stints(c),needs:needLane(lanes),apply:function(T){var y=T.characters.filter(function(z){return z.id===m.id;})[0]; if(!y) return false; y.name=c.name; y.memberships=clone(c.memberships);}});
  });
  // an event placed within a stretched day needs the span that stretches it
  items.forEach(function(it){ if(it.key.indexOf("ev:")) return; var e=R.events.filter(function(x){return "ev:"+x.id===it.key;})[0]||R.events.filter(function(x){return M.events.some(function(m){return "ev:"+m.id===it.key&&m.id===x.id;});})[0];
    if(!e||!e.sub) return; R.spans.forEach(function(s){ if(s.flux&&s.flux.mode==="fast"&&s.lane===e.lane&&s.from<=e.day&&e.day<=s.to){ var k=items.filter(function(o){return o.key==="s:"+s.id||(o.key.indexOf("s:")===0&&M.spans.some(function(ms){return "s:"+ms.id===o.key&&(ms.id===s.id||(ms.lane===s.lane&&ms.from===s.from&&ms.to===s.to));}));})[0]; if(k&&it.needs.indexOf(k.key)<0) it.needs.push(k.key);} }); });
  return items;
}
function fitDayCount(T){var mx=T.dayCount; T.events.forEach(function(e){mx=Math.max(mx,e.day);}); T.spans.forEach(function(s){mx=Math.max(mx,s.to);}); T.crossings.forEach(function(c){mx=Math.max(mx,c.from.day,c.to.day);});
  T.characters.forEach(function(c){c.memberships.forEach(function(m){mx=Math.max(mx,m.to||m.from);});}); T.lanes.forEach(function(l){if(l.now!=null) mx=Math.max(mx,l.now);}); Object.keys(T.dayNotes).forEach(function(k){mx=Math.max(mx,+k);}); T.dayCount=Math.min(2000,mx);}
function addAsCopy(R,M){var c=clone(R); c.origin=(M&&(M.origin||M.id))||R.origin||R.id; c.id=uid("tl"); c.title=R.title+" (imported)"; delete c.publishedAt; c.basedOn=""; WS.timelines.push(c); saveNow(); switchTo(c.id); return c;}
function nextReview(){ if(!mergeQueue.length) return; var job=mergeQueue.shift(); openReview(job.theirs,job.mine); }
function openReview(R,M){
  var items=diffTimelines(M,R), dw=(M.dayLabel||"Day").toLowerCase();
  var copyBtn='<button class="btn" id="mCopy">Add as a separate copy</button>';
  if(!items.length){ openDlg('<h2>Nothing new</h2><p>“'+esc(R.title)+'” has nothing your copy of “'+esc(M.title)+'” doesn’t already have.</p><div class="acts"><button class="btn" id="mClose">Close</button>'+copyBtn+'</div>',function(d){
      $("#mClose",d).onclick=function(){closeDlg(); nextReview();}; $("#mCopy",d).onclick=function(){closeDlg(); addAsCopy(R,M); setStatus("Added “"+R.title+"” as a separate copy"); nextReview();};}); return; }
  var row=function(it,i){return '<li class="mi'+(it.blocked?' off':'')+'"><label><input type="checkbox" data-k="'+i+'"'+(it.blocked?' disabled':' checked')+'><span><b>'+esc(it.label)+'</b>'+(it.detail?'<small>'+esc(it.detail)+'</small>':'')+(it.blocked?'<small class="err">'+esc(it.blocked)+'</small>':'')+'</span></label>'+
    (it.show&&it.show.length?'<details><summary>Show theirs</summary><ul>'+it.show.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul></details>':'')+'</li>';};
  var grp=function(g,title){var h=""; items.forEach(function(it,i){if(it.group===g) h+=row(it,i);}); return h?'<h3>'+title+'</h3><ul class="mlist">'+h+'</ul>':"";};
  openDlg('<h2>Changes in “'+esc(R.title)+'”</h2><p class="note">Compared with your copy of “'+esc(M.title)+'”. Check what to bring in. Nothing is removed from your copy, private notes in the file are ignored, and you can undo it.</p>'+
    '<div class="mtools"><button class="btn quiet" id="mAll">Select all</button><button class="btn quiet" id="mNone">Select none</button><span class="note" id="mCount"></span></div>'+
    '<div class="merge" id="mBox">'+grp("new","New")+grp("changed","Changed")+'</div>'+
    '<div class="acts"><button class="btn" id="mCancel">Not now</button>'+copyBtn+'<button class="btn" id="mGo">Bring them in</button></div>',function(d){
    var boxes=$$("[data-k]",d), byKey={}, boxOf={}; items.forEach(function(it,i){byKey[it.key]=i;}); boxes.forEach(function(b){boxOf[b.dataset.k]=b;});
    var count=function(){var n=boxes.filter(function(b){return b.checked;}).length; $("#mCount",d).textContent=n+" of "+boxes.filter(function(b){return !b.disabled;}).length+" chosen"; $("#mGo",d).disabled=!n; $("#mGo",d).textContent=n?("Bring in "+n):"Bring them in";};
    boxes.forEach(function(b){b.onchange=function(){var it=items[+b.dataset.k];
      if(b.checked) it.needs.forEach(function(k){var j=byKey[k]; if(j!=null&&boxOf[j]) boxOf[j].checked=true;});
      else items.forEach(function(o,j){if(o.needs.indexOf(it.key)>=0&&boxOf[j]) boxOf[j].checked=false;});
      count();};});
    $("#mAll",d).onclick=function(){boxes.forEach(function(b){if(!b.disabled) b.checked=true;}); count();};
    $("#mNone",d).onclick=function(){boxes.forEach(function(b){b.checked=false;}); count();};
    $("#mCancel",d).onclick=function(){closeDlg(); nextReview();};
    $("#mCopy",d).onclick=function(){closeDlg(); addAsCopy(R,M); setStatus("Added “"+R.title+"” as a separate copy"); nextReview();};
    $("#mGo",d).onclick=function(){
      var pick=boxes.filter(function(b){return b.checked;}).map(function(b){return items[+b.dataset.k];});
      if(M.id!==T.id) switchTo(M.id);
      var rank=function(it){return it.key.indexOf("lane:")===0?0:it.key.indexOf("s:")===0?1:2;}; pick.sort(function(a,b){return rank(a)-rank(b);});
      snap(); var done=0, skipped=0; pick.forEach(function(it){ if(it.apply(T)===false) skipped++; else done++; });
      fitDayCount(T); touch(); closeDlg(); renderAll();
      setStatus("Brought in "+done+" change"+(done===1?"":"s")+" from “"+R.title+"”"+(skipped?(". "+skipped+" couldn’t be applied"):"")+". Undo is in edit mode.");
      nextReview();
    };
    count();
  });
}

/* ---------- help ---------- */
function openHelp(){
  var dwl=dayWordL(), keeper=!!(ART&&canPublish);
  openDlg('<h2>How Threads works</h2><p class="note">The short version is below. The '+extLink(GUIDE_URL,'full guide')+' has more, with a troubleshooting section.</p><div class="help">'+
    '<h3>Reading it</h3><p>Each event shows its lane, title, place and summary; choose it to open the beats, quotes and notes, or use Show all details. Each colored thread is a lane: a party, a character, or a strand of world events. Pick a '+esc(dwl)+' on the timeline, or use the arrow keys, to read what every lane was doing then, where the lanes touch, and who was with whom. The lane buttons above the timeline hide and show lanes.</p>'+
    '<h3>Following someone</h3><p>Type a name in Follow to light up every '+esc(dwl)+' they appear. Characters who move between groups have their path drawn across the lanes.</p>'+
    '<h3>Who’s where</h3><p>Lanes that people travel with list who’s with them on each '+esc(dwl)+'. Anyone leaving a lane is listed under Departs, with why: moving to another lane, dying, staying behind. Someone who moves partway through a '+esc(dwl)+' shows as departing one lane and joining the other on that '+esc(dwl)+'. Someone is marked as joining only if they weren’t with that lane the '+esc(dwl)+' before, and as rejoining if they’ve been with it earlier. In edit mode, choose a name in the '+esc(dwl)+' panel to move them, mark them departing, or change their dates, and add people with the box underneath; its “from” '+esc(dwl)+' can be set earlier for someone who’s been there all along. Turn the list on or off for each lane in Timeline settings.</p>'+
    '<h3>Fixing the calendar</h3><p>Missed a '+esc(dwl)+' for one party? In edit mode, select the '+esc(dwl)+' and choose Insert a '+esc(dwl)+' here in that lane’s block: that lane’s later '+esc(dwl)+'s move along one, and every other lane stays put. Remove this '+esc(dwl)+' does the reverse. The buttons under the timeline do the same for every lane at once.</p>'+
    '<h3>When time runs differently</h3><p>A span can say that time runs faster or slower there, say in another realm. Faster time stretches those '+esc(dwl)+'s so several '+esc(dwl)+'s there fit into each one here, each with its own spot for an event. Slower time joins each run of '+esc(dwl)+'s here into one '+esc(dwl)+' there, with a single spot for its event. Every event shows its local '+esc(dwl)+'.</p>'+
    '<h3>Adding your own notes</h3><p>Choose Edit to add or change anything. Click anywhere on a '+esc(dwl)+' to select it; clicking an empty spot on a lane highlights that lane in the '+esc(dwl)+' panel below, where Add an event creates one there. Clicking an event selects its '+esc(dwl)+' and highlights it in the panel; double-click it, or choose its Edit button, to change it. Your edits stay in this browser as your own copy, and nobody else sees them. Private notes are for you alone and never leave your copy unless you choose to export them.</p>'+
    '<h3>Sending additions to whoever keeps the timeline</h3><p>Choose Export, download this timeline, and post the file wherever your group talks. They import it, see exactly what you added or changed, and pick what to keep.</p>'+
    '<h3>'+(keeper?'Keeping the timeline (that’s you)':'Keeping the timeline')+'</h3><p>Import a file someone sent you and Threads compares it with your copy, listing their new and changed entries with a checkbox each. Bring in what you want, then '+(keeper?'choose Publish to this page':'publish it')+' so everyone gets the new version. Nothing of yours is removed, and Undo takes it back.</p>'+
    '<h3>When the page is updated</h3><p>If a newer version is published, you’re asked whether to load it, keep it alongside your copy, or keep yours.</p>'+
    '<h3>Starting another campaign</h3><p>New timeline starts a fresh one here, in your browser. For another group entirely, Export can download a blank copy of Threads as a single web page they can open in any browser or host themselves.</p>'+
    '</div><p class="credit">'+creditHTML()+'</p><div class="acts"><button class="btn" id="hWel">Show the welcome screen</button><button class="btn" id="hClose">Close</button></div>',function(d){$("#hClose",d).onclick=closeDlg; $("#hWel",d).onclick=function(){closeDlg(); openWelcome();};});
}

/* ---------- welcome, once per browser ---------- */
function openWelcome(){ var w=$("#welcome"); if(!w) return; var t=T;
  w.innerHTML='<h2 id="wTitle">Welcome to Threads</h2><p class="wlead">A shared timeline for tabletop campaigns: one colored thread per party, running side by side, day by day.</p>'+
    (t&&t.title?'<p>You’re looking at <b>'+esc(t.title)+'</b>.</p>':'')+
    '<ul class="wl"><li><b>Pick a day</b> on the timeline to read what every party was doing, and who was with whom.</li>'+
    '<li><b>Follow</b> a name to light up every day they appear.</li>'+
    '<li><b>Edit</b> to add your own notes. They stay in this browser, and nobody else sees them unless you export them.</li></ul>'+
    '<div class="acts"><button class="btn" id="wNew">Start my own timeline</button>'+extLink(GUIDE_URL,'Read the guide','btn')+'<button class="btn go" id="wGo">Start exploring</button></div>'+
    '<p class="credit">'+creditHTML()+'</p>';
  var done=function(){ try{localStorage.setItem("threads-welcomed","1");}catch(e){} };
  var shut=function(){ done(); if(w.close) w.close(); else w.removeAttribute("open"); };
  $("#wGo",w).onclick=shut; $("#wNew",w).onclick=function(){shut(); openNew();};
  w.addEventListener("close",done,{once:true});
  if(w.showModal){ try{ if(!w.open) w.showModal(); }catch(e){ w.setAttribute("open",""); } } else w.setAttribute("open","");
  var g=$("#wGo",w); if(g) try{g.focus();}catch(e){}
}

/* ---------- render all ---------- */
function renderAll(){ if(!T) T=cur(); if(sel>T.dayCount) sel=T.dayCount; renderHeader(); renderBar(); renderNotices(); renderSettings(); renderFollowSoft(); renderLaneLabels(); draw(); renderDayOps(); renderLegend(); renderPanel(); rememberView(); }
renderAll(); setStatus(statusText||"Saved in this browser");
$("#credit").innerHTML=creditHTML();
if(!returning) openWelcome();
requestAnimationFrame(function(){scrollToSel(false);});

/* ---------- capabilities, lit up when they arrive ---------- */
var C=window.claude;
if(C&&typeof C.use==="function"){
  C.use("downloads").then(function(ns){DL=ns;},function(){});
  C.use("artifact").then(function(ns){ART=ns; if(!ART) return;
    renderBar();
    C.use("user").then(function(us){ if(!us||typeof us.canEdit!=="function") return; Promise.resolve(us.canEdit()).then(function(v){ if(v===false){canPublish=false; renderBar();} },function(){}); },function(){});
  },function(){});
}
})();
